<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kommode 3D</title>
<style>
  :root { --bg:#f4f2ee; --panel:#ffffffee; --ink:#1d1d1b; --mute:#6b6862; --err:#b3261e; --warn:#9a6700; --ok:#2e7d32; --line:#d9d5cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171716; --panel:#232321ee; --ink:#ecebe7; --mute:#a3a09a; --err:#ff8a80; --warn:#ffd166; --ok:#81c784; --line:#3a3936; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #ctl { top:12px; left:12px; width:300px; max-height:calc(100% - 24px); overflow:auto; box-sizing:border-box; }
  select { font:inherit; font-size:12px; width:100%; padding:3px 4px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .mat { display:grid; grid-template-columns:72px 1fr; gap:4px 8px; align-items:center; font-size:12px; }
  .mat span { color:var(--mute); }
  .mat input[type=color] { grid-column:2; width:100%; height:22px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  #cost table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  #cost td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:top; }
  #cost td.n { text-align:right; white-space:nowrap; }
  #cost .sub { color:var(--mute); font-size:11px; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:3px; } .bar i { display:block; height:100%; background:var(--ok); border-radius:2px; }
  textarea { width:100%; box-sizing:border-box; font:11px ui-monospace, monospace; height:120px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
  details summary { cursor:pointer; font-size:12px; margin-top:8px; }
  #st { top:12px; right:12px; width:360px; max-height:calc(100% - 24px); overflow:auto; }
  #tip { pointer-events:none; padding:4px 8px; font-size:12px; display:none; }
  h1 { font-size:15px; margin:0 0 8px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:12px 0 4px; }
  label { display:flex; gap:6px; align-items:center; margin:3px 0; cursor:pointer; }
  input[type=range] { width:100%; }
  ul { margin:0; padding-left:18px; } li { margin:2px 0; }
  .err { color:var(--err); } .warn { color:var(--warn); } .ok { color:var(--ok); }
  .big { font-size:16px; font-weight:600; }
  button { font:inherit; font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  .kv { display:grid; grid-template-columns:auto auto; gap:2px 10px; font-variant-numeric:tabular-nums; }
  .kv span:nth-child(odd) { color:var(--mute); }
  @media (max-width: 700px) { #st { top:auto; bottom:12px; left:12px; right:12px; width:auto; max-height:40%; } #ctl { width:auto; right:12px; } }

  html.embed #st, html.embed #ctl > :not(.keep) { display:none !important; }
  html.embed #ctl { width:auto; right:auto; max-width:280px; }
  html.embed, html.embed body { background:transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (/[?&]embed/.test(location.search)) {
  document.documentElement.classList.add('embed');
  addEventListener('DOMContentLoaded', () => {
    const t = (sel, s) => { const el = document.querySelector(sel); if (el) el.firstChild.textContent = s; };
    document.querySelector('#ctl h1').textContent = 'Drag to rotate · scroll to zoom';
    document.querySelector('#ex').parentNode.firstChild.textContent = 'Explode ';
    document.querySelector('#op').parentNode.firstChild.textContent = 'Open drawers ';
    document.querySelector('#ctr').textContent = 'Recenter'; document.querySelector('#cls').textContent = 'Close all';
  });
  addEventListener('load', () => {            // intro: explode out and back once
    const ex = document.querySelector('#ex'); if (!ex) return;
    const t0 = performance.now(), D = 3200;
    (function step(now) {
      const k = Math.min(1, (now - t0) / D), v = Math.sin(Math.PI * k) * 0.75;
      ex.value = v; ex.dispatchEvent(new Event('input', { bubbles: true }));
      if (k < 1) requestAnimationFrame(step);
    })(t0 + 1);
  });
}
</script>
<div id="ctl" class="panel">
  <h1 class="keep">Kommode – 3D</h1>
  <label class="keep">Sprengskisse <input id="ex" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label class="keep">Alle skuffer ut <input id="op" type="range" min="0" max="1" step="0.01" value="0"></label>
  <div class="keep" style="display:flex;gap:6px;margin-top:6px">
    <button id="ctr">Sentrer</button><button id="cls">Lukk alle</button>
  </div>
  <p style="color:var(--mute);font-size:12px;margin:6px 0 0">Klikk på en skuff for å åpne/lukke den. Dobbeltklikk = sentrer.</p>
  <h2>Plater (kan bestilles)</h2>
  <div class="mat" id="mat"></div>
  <h2>Utseende</h2>
  <div class="mat" id="look"></div>
  <h2>Vis</h2>
  <div id="grps"></div>
  <h2>Mål</h2>
  <div class="kv" id="kv"></div>
</div>
<div id="st" class="panel"><div id="cost"></div><div id="status"></div></div>
<div id="tip" class="panel"></div>

}
// ---- handles (not in the cut list – just for the look): bar handle on the front's centre, c/c from params
const HCC = I.hcc || 192;
for (const a of D.asm.filter(a => a.grp === 'front')) {
  const [x, y, z, dx, dy, dz] = a.b, id = a.label.split(' ').pop();
  const cx = x + dx / 2, cz = z + dz / 2, L = HCC + 40, R = 6, OUT = 32;
  const g = new THREE.CylinderGeometry(R, R, L, 24); g.rotateZ(Math.PI / 2);
  const bar = new THREE.Mesh(g, null);
  for (const s of [-1, 1]) {
    const pg = new THREE.CylinderGeometry(4.5, 4.5, OUT, 16); pg.rotateX(Math.PI / 2);
    const post = new THREE.Mesh(pg, null); post.position.set(s * HCC / 2, 0, -OUT / 2); bar.add(post);
  }
  const b = [cx - L / 2, y - OUT - R, cz - R, L, OUT + R, 2 * R];
  bar.userData = { a: { grp: 'handtak', label: 'Håndtak ' + id, b }, base: new THREE.Vector3(cx, cz, -(y - OUT)) };
  bar.position.copy(bar.userData.base);
  scene.add(bar); meshes.push(bar);
}
// ---- cosmetic: legs + handles (remembered per browser)
let choice = { ...DEFAULT };
try { Object.assign(choice, JSON.parse(localStorage.getItem('kommode-mat') || '{}')); } catch (e) {}
function applyMat(grp) {
  const mat = makeMat(choice[grp], grp);
  for (const m of meshes) if (m.userData.a.grp === grp) { m.material = mat; m.children.forEach(c => { if (c.isMesh) c.material = mat; }); }
}
const lookEl = document.getElementById('look');
for (const grp of Object.keys(CHOICE)) {
  if (!CHOICE[grp].includes(choice[grp])) choice[grp] = DEFAULT[grp];
  const sp = document.createElement('span'); sp.textContent = NAME[grp];
  const sel = document.createElement('select');
  sel.innerHTML = CHOICE[grp].map(k => `<option value="${k}">${MATS[k].n}</option>`).join('');
  sel.value = choice[grp];
  sel.onchange = () => { choice[grp] = sel.value; applyMat(grp); try { localStorage.setItem('kommode-mat', JSON.stringify(choice)); } catch (e) {} };
  lookEl.append(sp, sel); applyMat(grp);
}

// ---- sheet products from materialer.json: pick per role -> 3D colour + re-nest + price, live.
//      The nesting below is a line-for-line port of nestlib.py (split_sheet, Bin, _pack1, pack, plan),
//      so the numbers match what `python3 kommode.py` writes for the same choice.
const M = D.mat, KAT = Object.fromEntries(M.katalog.map(m => [m.id, m]));
const ROLE_OF = { K: 'front', A: 'ytre', C: 'ytre', CH: 'ytre', B: 'korpus', D: 'korpus', H: 'korpus', S: 'skuff', SH: 'skuff', E1: 'skuff', E2: 'skuff', SB: 'skuffebunn', G: 'bakplate' };
const THK = { front: 'front', ytre: 'korpus', korpus: 'korpus', skuff: 'skuff', skuffebunn: 'skuffebunn', bakplate: 'bakplate' };
let valg = { ...M.valg }, paint = {};
try { const v = JSON.parse(localStorage.getItem('kommode-valg') || '{}');
      for (const r of M.roles) if (KAT[v[r]]) valg[r] = v[r];
      paint = JSON.parse(localStorage.getItem('kommode-farge') || '{}'); } catch (e) {}

function splitSheet(fmt, bed, kerf, minBit) {
  const L = Math.max(...fmt), W = Math.min(...fmt), BL = Math.max(...bed), BW = Math.min(...bed);
  const cut = (n, m) => { const out = []; let rest = n;
    while (rest > 0) { const t = Math.min(rest, m); out.push(t); rest -= t + kerf; }
    const k = out.filter(x => x >= minBit); return k.length ? k : out.slice(0, 1); };
  const r = []; for (const a of cut(L, BL)) for (const b of cut(W, BW)) r.push([a, b]); return r;
}
class Bin {
  constructor(W, H, margin, gap) { this.W = W; this.H = H; this.free = [[margin, margin, W - 2 * margin + gap, H - 2 * margin + gap]]; this.placed = []; }
  find(w, h) { let best = null;
    for (const [fx, fy, fw, fh] of this.free) if (w <= fw && h <= fh) {
      const sc = [Math.min(fw - w, fh - h), Math.max(fw - w, fh - h)];
      if (!best || sc[0] < best[0][0] || (sc[0] === best[0][0] && sc[1] < best[0][1])) best = [sc, fx, fy]; }
    return best; }
  place(x, y, w, h) { const nf = [];
    for (const [fx, fy, fw, fh] of this.free) {
      if (x >= fx + fw || x + w <= fx || y >= fy + fh || y + h <= fy) { nf.push([fx, fy, fw, fh]); continue; }
      if (x > fx) nf.push([fx, fy, x - fx, fh]);
      if (x + w < fx + fw) nf.push([x + w, fy, fx + fw - x - w, fh]);
      if (y > fy) nf.push([fx, fy, fw, y - fy]);
      if (y + h < fy + fh) nf.push([fx, y + h, fw, fy + fh - y - h]); }
    const same = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
    this.free = nf.filter(r => !nf.some(o => !same(r, o) && r[0] >= o[0] && r[1] >= o[1] && r[0] + r[2] <= o[0] + o[2] && r[1] + r[3] <= o[1] + o[3])); }
}
const lt = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return true; if (a[i] > b[i]) return false; } return false; };
function pack1(items, sizes, rot, margin, gap) {
  const bins = [];
  for (const it of items) {
    const opts = [[it.L, it.B, false]].concat(rot ? [[it.B, it.L, true]] : []);
    let placed = false;
    for (const b of bins) { let best = null;
      for (const [w, h, r] of opts) { const f = b.find(w + gap, h + gap); if (f && (!best || lt(f[0], best[0]))) best = [f[0], f[1], f[2], w, h, r]; }
      if (best) { const [, x, y, w, h, r] = best; b.place(x, y, w + gap, h + gap); b.placed.push({ ...it, x, y, rot: r }); placed = true; break; } }
    if (placed) continue;
    for (;;) {
      if (bins.length >= sizes.length) return null;
      const b = new Bin(...sizes[bins.length], margin, gap); b.idx = bins.length; bins.push(b);
      let hit = null;
      for (const [w, h, r] of opts) { const f = b.find(w + gap, h + gap); if (f) { hit = [f, w, h, r]; break; } }
      if (hit) { const [f, w, h, r] = hit; b.place(f[1], f[2], w + gap, h + gap); b.placed.push({ ...it, x: f[1], y: f[2], rot: r }); break; }
    }
  }
  return bins;
}
function pack(items, sizes, rot, margin, gap) {
  let best = null;
  for (const key of [i => -(i.L * i.B), i => -Math.max(i.L, i.B), i => -i.B, i => -i.L, i => -(i.L + i.B)]) {
    const bins = pack1([...items].sort((a, b) => key(a) - key(b)), sizes, rot, margin, gap);
    if (!bins) continue;
    const used = bins.filter(b => b.placed.length);
    const sc = [Math.max(...used.map(b => b.idx)), used.length, -bins[0].placed.length];
    if (!best || lt(sc, best[0])) best = [sc, bins];
  }
  return best && best[1].filter(b => b.placed.length);
}
function plan(items, pieces, rot, margin, gap) {
  for (let n = 1; n <= 8; n++) {
    const sizes = []; for (let k = 0; k < n; k++) sizes.push(...pieces);
    const bins = pack(items, sizes, rot, margin, gap);
    if (bins) return { bins, sheets: Math.floor(Math.max(...bins.map(b => b.idx)) / pieces.length) + 1 };
  }
  return null;
}
function evaluate(v) {
  const t = r => KAT[v[r]].tykkelse;
  const issues = [];
  if (t('ytre') !== t('korpus')) issues.push(`Topp/sider (${t('ytre')} mm) og korpus (${t('korpus')} mm) må ha samme tykkelse.`);
  const th = { front: t('front'), korpus: t('korpus'), skuff: t('skuff'), skuffebunn: t('skuffebunn'), bakplate: t('bakplate') };
  const parts = M.lists[M.keys.map(k => String(th[k])).join('|')];
  if (!parts) return { issues: issues.concat('Ingen delliste for denne tykkelseskombinasjonen.'), rows: [], total: 0 };
  const groups = {};
  for (const [code, role, qty, L, B] of parts) {
    const id = v[role]; (groups[id] ??= { m: KAT[id], items: [], roles: new Set(), area: 0 });
    groups[id].roles.add(role); groups[id].area += L * B * qty / 1e6;
    for (let i = 0; i < qty; i++) groups[id].items.push({ code, L, B });
  }
  const rows = []; let total = 0, est = false;
  for (const [id, g] of Object.entries(groups)) {
    const pieces = splitSheet(g.m.format, M.nest.bed, M.nest.kerf, M.nest.min_bit);
    const p = plan(g.items, pieces, !g.m.retning, M.nest.margin, M.nest.gap);
    const price = g.m.pris ?? g.m.pris_anslag ?? 0, anslag = g.m.pris == null;
    if (!p) { issues.push(`${g.m.navn}: delene får ikke plass (for store for platen?).`); continue; }
    const sum = price * p.sheets; total += sum; est ||= anslag;
    rows.push({ m: g.m, roles: [...g.roles].sort((a, b) => M.roles.indexOf(a) - M.roles.indexOf(b)), sheets: p.sheets, price, anslag, sum,
                area: g.area, use: g.area / (p.sheets * g.m.format[0] * g.m.format[1] / 1e6), bins: p.bins.length });
  }
  return { rows, total, est, issues };
}
const kr = n => Math.round(n).toLocaleString('nb-NO').replace(/ /g, ' ');
const BASE = evaluate(M.valg);
function productMat(r) {
  const m = KAT[valg[r]];
  const d = m.malbar && paint[r] ? { ...m.dekor, c: paint[r] } : m.dekor;
  if (d.wood) texCache[m.id] ??= woodTex(d.wood[0], d.wood[1], 1 + m.id.length * 977);
  return new THREE.MeshStandardMaterial(d.wood ? { map: texCache[m.id], color: 0xffffff, roughness: d.r } : { color: d.c, roughness: d.r });
}
function applyProducts() {
  const mats = Object.fromEntries(M.roles.map(r => [r, productMat(r)]));
  for (const m of meshes) { const r = ROLE_OF[m.userData.a.code]; if (r) m.material = mats[r]; }
}
const costEl = document.getElementById('cost');
function renderCost() {
  const E = evaluate(valg), d = E.total - BASE.total;
  const same = M.roles.every(r => valg[r] === M.valg[r]);
  costEl.innerHTML = `<h1 style="margin-bottom:2px">Plater: ${E.est ? '~' : ''}${kr(E.total)} kr</h1>
    <div class="sub" style="color:var(--mute);font-size:12px">${same ? 'Samme som lagret plan i params.json.' :
      `Lagret plan: ${BASE.est ? '~' : ''}${kr(BASE.total)} kr → <b class="${d > 0 ? 'err' : 'ok'}">${d > 0 ? '+' : ''}${kr(d)} kr</b>`}
      &nbsp;· hele plater, uten kantlist/kapping/frakt. ~ = anslag.</div>
    ${E.issues.length ? `<ul class="err">${E.issues.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    <table>${E.rows.map(r => `<tr><td>${r.m.navn}<div class="sub">${r.m.leverandor}${r.m.artnr ? ' · ' + r.m.artnr : ''} · ${r.m.format.join('×')} · ${r.m.tykkelse} mm<br>
        ${r.roles.map(x => M.role_name[x]).join(', ')}</div>
        <div class="bar" title="brukt ${Math.round(r.use * 100)} %"><i style="width:${Math.round(r.use * 100)}%"></i></div></td>
      <td class="n">${r.sheets} × ${r.anslag ? '~' : ''}${kr(r.price)}<div class="sub">brukt ${Math.round(r.use * 100)} %</div></td>
      <td class="n"><b>${r.anslag ? '~' : ''}${kr(r.sum)}</b></td></tr>`).join('')}</table>
    <details><summary>Bruk dette valget (DXF-er, rapport)</summary>
      <p class="sub" style="color:var(--mute);font-size:12px">Erstatt "materialvalg" i params.json med dette og kjør <code>python3 kommode.py</code>.</p>
      <textarea readonly id="snip">"materialvalg": ${JSON.stringify(Object.fromEntries(M.roles.map(r => [r, valg[r]])), null, 2)},</textarea>
      <button id="cp">Kopier</button> <button id="rs">Tilbake til lagret plan</button></details>`;
  document.getElementById('cp').onclick = () => { const t = document.getElementById('snip'); t.select(); navigator.clipboard?.writeText(t.value).catch(() => {}); };
  document.getElementById('rs').onclick = () => { valg = { ...M.valg }; buildSelects(); onChange(); };
}
const matEl = document.getElementById('mat');
function buildSelects() {
  matEl.innerHTML = '';
  for (const r of M.roles) {
    const sp = document.createElement('span'); sp.textContent = M.role_name[r];
    const sel = document.createElement('select');
    sel.innerHTML = M.katalog.filter(m => m.roller.includes(r)).map(m =>
      `<option value="${m.id}">${m.navn.replace(/^Spon melamin /, '')} · ${m.tykkelse} mm · ${m.pris == null ? '~' : ''}${kr(m.pris ?? m.pris_anslag)} kr</option>`).join('');
    sel.value = valg[r]; sel.title = KAT[valg[r]].pris_kilde || '';
    sel.onchange = () => { valg[r] = sel.value; sel.title = KAT[valg[r]].pris_kilde || ''; buildSelects(); onChange(); };
    matEl.append(sp, sel);
    if (KAT[valg[r]].malbar) {
      const c = document.createElement('input'); c.type = 'color'; c.value = paint[r] || KAT[valg[r]].dekor.c;
      c.oninput = () => { paint[r] = c.value; applyProducts(); try { localStorage.setItem('kommode-farge', JSON.stringify(paint)); } catch (e) {} };
      matEl.append(c);
    }
  }
}
function onChange() {
  applyProducts(); renderCost();
  try { localStorage.setItem('kommode-valg', JSON.stringify(valg)); } catch (e) {}
}
buildSelects(); onChange();
const centre = new THREE.Vector3(I.W / 2, I.HS / 2, -I.DEP / 2);
const grps = document.getElementById('grps');
for (const k of Object.keys(NAME)) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" checked> ${NAME[k]}`;
  l.firstChild.onchange = ev => meshes.forEach(m => { if (m.userData.a.grp === k) m.visible = ev.target.checked; });
  grps.appendChild(l);
}
// ---- drawers: every drawer part's label ends with its id (e.g. "1V"); front, box, bottom and the
//      inner slide member move together. Travel = full extension (slide length minus a little).
const TRAVEL = I.Ls - 20;
const drawers = {};           // id -> { cur, goal }
for (const m of meshes) {
  const a = m.userData.a;
  if (['front', 'skuff', 'skinne', 'handtak'].includes(a.grp)) {
    m.userData.dr = a.label.split(' ').pop();
    drawers[m.userData.dr] ??= { cur: 0, goal: 0 };
  }
}
const ex = document.getElementById('ex'), op = document.getElementById('op');
function layout() {
  const e = +ex.value, o = +op.value;
  for (const m of meshes) {
    const a = m.userData.a, p = m.userData.base.clone();
    const dr = drawers[m.userData.dr];
    if (dr) {
      const t = Math.max(dr.cur, o);
      p.z += t * TRAVEL * (a.grp === 'skinne' ? 0.5 : 1);   // slide's middle member travels half
    }
    const d = m.userData.base.clone().sub(centre); p.add(d.multiplyScalar(e * 0.6));
    if (a.grp === 'front' || a.grp === 'handtak') p.z += e * 250;
    m.position.copy(p);
  }
}
ex.oninput = op.oninput = layout;
document.getElementById('cls').onclick = () => { op.value = 0; for (const d of Object.values(drawers)) d.goal = 0; layout(); };

// ---- framing: fit the whole dresser (incl. legs, top overhang, opened drawers) in the free area
//      between the side panels, and centre it there.
// Built straight from the part data (not expandByObject: world matrices aren't updated before the
// first render, which put the box around the origin and pushed the dresser into a corner).
const bbox = new THREE.Box3();
for (const m of meshes) {
  const [x, y, z, dx, dy, dz] = m.userData.a.b;
  bbox.expandByPoint(new THREE.Vector3(x, z, -y)).expandByPoint(new THREE.Vector3(x + dx, z + dz, -(y + dy)));
}
bbox.max.z += TRAVEL * 0.5;                      // leave room for drawers coming out
const ctlEl = document.getElementById('ctl'), stEl = document.getElementById('st');
function frame() {
  const w = innerWidth, h = innerHeight, wide = w > 700;
  const left = wide ? ctlEl.offsetWidth + 24 : 0, right = wide ? stEl.offsetWidth + 24 : 0;
  const bottom = wide ? 0 : stEl.offsetHeight + 24, top = wide ? 0 : ctlEl.offsetHeight + 24;
  // shift the projection so the camera's centre lies in the middle of the free area
  cam.setViewOffset(w, h, (right - left) / 2, (bottom - top) / 2, w, h);
  const vw = Math.max(200, w - left - right), vh = Math.max(200, h - top - bottom);
  const c = bbox.getCenter(new THREE.Vector3()), size = bbox.getSize(new THREE.Vector3());
  const r = size.length() / 2;
  const fovV = THREE.MathUtils.degToRad(cam.fov), fovH = 2 * Math.atan(Math.tan(fovV / 2) * vw / h);
  const fit = Math.min(fovV * vh / h, fovH);
  const dist = r / Math.sin(fit / 2) * 0.92;
  const dir = new THREE.Vector3(0.45, 0.38, 1).normalize();   // front, slightly right and above
  ctl.target.copy(c);
  cam.position.copy(c).addScaledVector(dir, dist);
  cam.near = dist / 50; cam.far = dist * 10; cam.updateProjectionMatrix();
  ctl.update();
}
document.getElementById('ctr').onclick = frame;
canvas.addEventListener('dblclick', frame);

// ---- hover + click
const tip = document.getElementById('tip'), ray = new THREE.Raycaster(), mv = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  mv.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mv, cam);
  return ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
}
canvas.addEventListener('pointermove', ev => {
  const h = pick(ev);
  canvas.style.cursor = h && h.object.userData.dr ? 'pointer' : '';
  if (h) { const a = h.object.userData.a, b = a.b;
    tip.style.display = 'block'; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 14 + 'px';
    tip.textContent = `${a.label}  ${b[3]} × ${b[4]} × ${b[5]} mm`; } else tip.style.display = 'none';
});
let down = null;
canvas.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;   // was a drag, not a click
  const h = pick(ev), id = h && h.object.userData.dr;
  if (id) { const d = drawers[id]; d.goal = d.goal > 0.5 ? 0 : 1; }
});

function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; frame(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  let moving = false;
  for (const d of Object.values(drawers)) {
    if (Math.abs(d.goal - d.cur) > 0.001) { d.cur += (d.goal - d.cur) * 0.15; moving = true; }
    else d.cur = d.goal;
  }
  if (moving) layout();
  ctl.update(); renderer.render(scene, cam);
});
</script>
